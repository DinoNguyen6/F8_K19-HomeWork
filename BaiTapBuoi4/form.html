<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>FORM</title>
</head>
<body>
<!--  1  -->
<!--  GET: Lấy dữ liệu (hiển thị trên URL)  -->
<!--  POST: Gửi dữ liệu (ẩn trong body)  -->

<!--   2 -->
<!--  enctype="multipart/form-data": Vì file (ảnh, video, tài liệu…) là dữ liệu nhị phân, nên cần một cách gửi đặc biệt.
multipart/form-data giúp chia dữ liệu thành nhiều phần (multipart) để gửi file đúng cách lên server.  -->

<!--  3  -->
<!--  Dùng để lưu dẽ liệu ẩn trong form và gửi lên server khi submit mà người dùng ko thấy trên giao diện
      Người dùng có xem được  mặc dù ko hiển thị trên giao diện nhưng người dùng vẫn có thể xem bằng F12 và thậm chí chỉnh sửa giá trị trước khi
-->
<!--  4  -->
<!--  checkbox ko check vì ko có value nên ko gửi. Còn radio chỉ gửi khi có cái đươc chọn. Radio luôn gửi là do thường có checked mặc định  -->

<!--  5  -->
<!--  readonly: xem được nhưng ko sửa. DÙng khi: hiển thị thông tin cố định (username, mã đơn...), vẫn cần gửi dữ liệu lên sẻver
                      Disabled: bị vô hiệu hóa hoàn toàn. Dùng khi: tạm thời ko cho nhập(ví dụ: chưa chọn điều kiện). Không muốn gửi dữ liệu đi
-->
<form method="post" action="https://api-gateway.f8.edu.vn/action_page.php" enctype="multipart/form-data">
    <fieldset>
        <legend>Thông tin cơ bản</legend>
        <div>
            <label for="fullname">Họ và tên</label>
            <input id="fullname" type="text" name="fullname" placeholder="Nguyễn Văn A" required autofocus tabindex="1">
        </div>
        <div>
            <label for="email">Email</label>
            <input id="email" type="email" name="email" placeholder="example@gmail.com" required tabindex="2">
        </div>
        <div>
            <label for="password">Mật khẩu</label>
            <input id="password" type="password" minlangth="6" autocomplete="off" required tabindex="3">
        </div>
        <div>
            <label for="password">Nhập lại mật khẩu</label>
            <input id="password" type="password" name="confirm_password" minlength="6" autocomplete="off" required tabindex="4">
        </div>
        <div>
            <label for="tel">Số điện thoại</label>
            <input id="tel" type="tel" name="phone" placeholder="0*********" pattern="0[0-9]{9}" tabindex="5">
        </div>
        <div>
            <label for="birthday">Ngày sinh</label>
            <input id="birthday" type="date" required tabindex="6">
        </div>
        <div>
            <label for="age">Tuổi</label>
            <input id="age" type="number" name="age" min="1" max="120" tabindex="7">
        </div>
        <div>
            <label for="website">Website cá nhân</label>
            <!--      Muốn hiển thị dữ liệu cố định. Không cho sửa. Nhưng vẫn cần gửi dữ liệu đi      -->
            <input id="website" type="url" name="website" placeholder="https://..." tabindex="8" readonly>
        </div>
        <div>
            <label for="address">Địa chỉ</label>
            <input id="address" type="text" name="address" placeholder="Số nhà, đường, phường/xã" tabindex="9">
        </div>
        <div>
            <label for="zipcode">Mã bưu chính</label>
            <!--      readonly: xem được nhưng ko sửa. DÙng khi: hiển thị thông tin cố định (username, mã đơn...), vẫn cần gửi dữ liệu lên sẻver
                      Disabled: bị vô hiệu hóa hoàn toàn. Dùng khi: tạm thời ko cho nhập(ví dụ: chưa chọn điều kiện). Không muốn gửi dữ liệu đi
             -->
            <input id="zipcode" type="text" maxlength="6" placeholder="700000" tabindex="10" disabled>
        </div>
    </fieldset>
    <br>
    <br>

    <fieldset>
        <legend>Thông tin bổ sung</legend>
        <div>
            <label for="gender">Giới tính</label>
            <br>
            <input type="radio" id="male" name="gender" value="Nam" required tabindex="11">
            <label for="male">Nam</label>
            <br>
            <input type="radio" id="female" name="gender" value="Nữ" required tabindex="12">
            <label for="female">Nữ</label>
            <br>
            <input type="radio" id="others" name="gender" value="Khác" required tabindex="13">
            <label for="others">Khác</label>
        </div>
        <br>
        <div>
            <label for="hobby">Sở thích</label>
            <br>
            <input type="checkbox" id="book" name="hobby[]" value="Đọc sách" tabindex="14">
            <label for="book">Đọc sách</label>
            <br>
            <input type="checkbox" id="music" name="hobby[]" value="Nghe nhạc" tabindex="15">
            <label for="music">Nghe nhạc</label>
            <br>
            <input type="checkbox" id="travel" name="hobby[]" valuw="Du lịch" tabindex="16">
            <label for="travel">Du lịch</label>
            <br>
            <input type="checkbox" id="coder" name="hobby[]" value="Lập trình" tabindex="17">
            <label for="coder">Lập trình</label>
            <br>
            <input type="checkbox" id="cooking" name="hobby[]" value="Nấu ăn" tabindex="18">
            <label for="cooking">Nấu ăn</label>
            <br>
            <input type="checkbox" id="sports" name="hobby[]" value="Thể thao" tabindex="19">
            <label for="sports">Thể thao</label>
        </div>
        <br>
        <div>
            <label for="education">Trình độ học vấn</label>
            <select name="education" id="education" tabindex="20">
                <option value="high school">Trung học</option>
                <option value="college">Cao đẳng</option>
                <option value="university">Đại học</option>
                <option value="postgraduate">Sau đại học</option>
            </select>
        </div>
        <br>
        <div>
            <label for="city">Tỉnh / Thành phố</label>
            <select name="city" id="city" multiple tabindex="21">
                <option value="Hanoi">Hà Nội</option>
                <option value="Vinh phuc">Vĩnh Phúc</option>
                <option value="Da nang">Đà Nẵng</option>
                <option value="Nha trang">Nha Trang</option>
                <option value="tpHCM">TP.Hồ Chí Minh</option>
            </select>
        </div>
        <br>
        <div>
            <label for="job">Nghề nghiệp</label>
            <select name="job" id="job" tabindex="22">
                <option value="Student">Học sinh</option>
                <option value="University">Sinh viên</option>
                <option value="Office worker">Nhân viên văn phòng</option>
                <option value="Dev">Dev</option>
                <option value="Others">Khác</option>
            </select>
        </div>
        <br>
        <div>
            <label for="course">Khóa học quan tâm</label>
            <br>
            <label for="html/css">
                <input type="checkbox" id="html/css" name="course[]" value="HTML/CSS" tabindex="23">
                HTML/CSS
            </label>
            <br>
            <label for="JavaScript">
                <input type="checkbox" id="JavaScript" name="course[]" value="JavaScript" tabindex="24">
                JavaScript
            </label>
            <br>
            <label for="ReactJS">
                <input type="checkbox" id="ReactJS" name="course[]" value="ReactJS" tabindex="25">
                ReactJS
            </label>
            <br>
            <label for="NodeJS">
                <input type="checkbox" id="NodeJS" name="course[]" value="NodeJS" tabindex="26">
                NodeJS
            </label>
            <br>
            <label for="Python">
                <input type="checkbox" id="Python" name="course[]" value="Python" tabindex="27">
                Python
            </label>
        </div>
        <br>
        <div>
            <label for="study_type">Hình thức học</label>
            <br>
            <label for="Online">
                <input type="radio" id="Online" name="study_type" value="Online" tabindex="28">
                Online
            </label>
            <br>
            <label for="Offline">
                <input type="radio" id="Offline" name="study_type" value="Offline" tabindex="29">
                Offline
            </label>
        </div>
        <br>
        <div>
            <label for="bio">
                Giới thiệu bản thân
                <br>
                <textarea name="bio" id="bio" rows="" placeholder="Viết vài dòng giới thiệu bản thân" tabindex="30"></textarea>
            </label>
        </div>
        <br>
        <div>
            <label for="avatar">
                Ảnh đại diện
                <input type="file" id="avatar" name="avatar" accept=".jbg,.png" tabindex="31">
            </label>
        </div>
        <br>
        <div>
            <label for="cv">
                CV / Hồ sơ
                <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx" tabindex="32">
            </label>
        </div>
    </fieldset>
    <br>
    <br>
    <fieldset>
        <legend>Input đặc biệt</legend>
        <div>
            <label for="fav_color">
                Màu yêu thích
                <input type="color" id="fav_color" name="fav_color" value="#ff6600" tabindex="33">
            </label>
        </div>
        <div>
            <label for="satisfaction">
                Mức độ hài lòng (0-10)
                <input type="range" id="satisfaction" name="satisfaction" min="0" max="10" value="5" tabindex="34">
            </label>
        </div>
        <div>
            <label for="study_time">
                Giờ học trong ngày
                <input type="time" id="study_time" name="study_time" tabindex="35">
            </label>
        </div>
        <div>
            <label for="start_month">
                Tháng bắt đầu học
                <input type="month" id="start_month" name="start_month" tabindex="36">
            </label>
        </div>
        <div>
            <label for="start_week">
                Tuần bắt đầu học
                <input type="week" id="start_week" name="start_week" tabindex="37">
            </label>
        </div>
        <div>
            <label for="register_at">
                Ngày & giờ đăng ký
                <input type="datetime-local" id="register_at" name="register_at" tabindex="38">
            </label>
        </div>
        <div>
            <label for="search_course">
                Tìm kiếm khóa học
                <input type="search" id="search_course" name="search_course" placeholder="Nhập tên khóa học..." tabindex="39">
            </label>
        </div>
        <div>
            <label for="experience">
                Số năm kinh nghiệm
                <input type="number" id="experience" name="experience" min="0" max="50" step="1" value="0" tabindex="40">
            </label>
        </div>
        <div>
            <label for="budget">
                Mức học phí mong muốn
                <input type="range" id="budget" name="budget" min="0" max="5000000" step="100000" value="1000000" tabindex="41">
            </label>
        </div>
        <div>
            <label for="fav_lang">
                Ngôn ngữ lập trình yêu thích
                <input type="text" id="fav_lang" placeholder="VD: JavaScript, Python..." tabindex="42">
            </label>
        </div>
    </fieldset>
    <fieldset>
       <legend>Xác nhận & điều khoản</legend>
        <div>
            <label for="agree_terms">
                <input type="checkbox" id="agree_terms" name="agree_terms" required tabindex="43">
                Tôi đồng ý với điều khoản sử dụng
            </label>
        </div>
        <div>
            <label for="subscribe">
                <input type="checkbox" id="subscribe" name="subscribe" tabindex="44">
                Nhận thông báo qua email
            </label>
        </div>
        <div>
            <label for="sms_notify">
                <input type="checkbox" id="sms_notify" name="sms_notify" tabindex="45">
                Nhận thông báo qua SMS
            </label>
        </div>
        <div>
            <label for="ref_code">
                Mã giới thiệu
                <input type="text" id="ref_code" name="ref_code" placeholder="Nhập mã nếu có" tabindex="46">
            </label>
        </div>
        <div>
            <label for="course_id">
                Mã khóa học (ẩn)
                <input type="hidden" id="course_id" name="course_id" value="F8_2024" tabindex="47">
            </label>
        </div>
        <div>
            <label for="utm_source">
                Nguần truy cập (ẩn)
                <input type="hidden" id="utm_source" name="utm_source" tabindex="48">
            </label>
        </div>
    </fieldset>

    <br>
    <br>
    <div>
        <input type="submit" value="Đăng ký ngay" tabindex="49">
        <input type="reset" value="Nhập lại" tabindex="50">
    </div>
</form>
</body>
</html>
