<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Invoice</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            padding: 30px;
        }

        .invoice {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 40px;
        }

        .brand h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .brand p {
            color: gray;
        }

        .invoice-info {
            text-align: right;
        }

        .invoice-info h3 {
            color: green;
            margin-bottom: 10px;
        }

        .info-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            gap: 40px;
        }

        .box {
            flex: 1;
        }

        .box h4 {
            margin-bottom: 15px;
            color: gray;
        }

        .box p {
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 40px;
        }

        table th,
        table td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        table th {
            background: #fafafa;
            color: gray;
        }

        .summary {
            display: flex;
            justify-content: space-between;
            gap: 30px;
        }

        .promotion-box {
            flex: 1;
            background: #f0fff8;
            border: 1px solid #b7f0d0;
            padding: 20px;
            border-radius: 10px;
        }

        .promotion-box h4 {
            color: green;
            margin-bottom: 10px;
        }

        .total-box {
            width: 300px;
        }

        .total-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .grand-total {
            font-size: 28px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

<div class="invoice" id="invoice"></div>

<script>

    // =========================
    // DATA
    // =========================

    const invoiceData = {
        meta: {
            invoiceNo: "WM-20260521-0001",
            saleDate: "2026/05/21",
            currency: "VND",
            paymentMethod: "Cash"
        },

        seller: {
            name: "WinMark 2 ba trung",
            address: "2 Ba trung - HN",
            phone: "012345678",
            representative: "Đại diện WinMark"
        },

        customer: {
            name: "Nguyen Van A",
            age: 20,
            address: "Ha Dong Ha noi"
        },

        items: [
            {
                no: 1,
                name: "Ao Thun",
                size: "XL",
                quantity: 1,
                price: 200000
            },
            {
                no: 2,
                name: "Ao Thun",
                size: "XL",
                quantity: 1,
                price: 200000
            }
        ],

        promotion: {
            description: "Khuyen mai 50% chi KH than thiet",
            discountPercent: 50
        }
    };


    // =========================
    // HELPER FUNCTIONS
    // =========================

    function formatCurrency(number) {
        return number.toLocaleString("vi-VN") + " đ";
    }


    // =========================
    // CALCULATE TOTAL
    // =========================

    const subTotal = invoiceData.items.reduce(function(total, item) {
        return total + (item.quantity * item.price);
    }, 0);

    const discount =
        subTotal * invoiceData.promotion.discountPercent / 100;

    const grandTotal = subTotal - discount;


    // =========================
    // RENDER ITEMS
    // =========================

    const itemRows = invoiceData.items.map(function(item) {

        const total = item.quantity * item.price;

        return `
        <tr>
          <td>${item.no}</td>
          <td>${item.name}</td>
          <td>${item.size}</td>
          <td>${item.quantity}</td>
          <td>${formatCurrency(item.price)}</td>
          <td>${formatCurrency(total)}</td>
        </tr>
      `;
    }).join("");


    // =========================
    // TEMPLATE HTML
    // =========================

    const html = `

      <!-- HEADER -->
      <div class="header">

        <div class="brand">
          <h1>${invoiceData.seller.name}</h1>
          <p>Cung cấp sản phẩm thời trang cao cấp</p>
        </div>

        <div class="invoice-info">
          <h3>HÓA ĐƠN BÁN LẺ</h3>
          <p><strong>Mã số:</strong> ${invoiceData.meta.invoiceNo}</p>
          <p><strong>Ngày bán:</strong> ${invoiceData.meta.saleDate}</p>
        </div>

      </div>


      <!-- SELLER + CUSTOMER -->
      <div class="info-section">

        <div class="box">
          <h4>ĐƠN VỊ BÁN HÀNG</h4>

          <p><strong>${invoiceData.seller.name}</strong></p>
          <p>${invoiceData.seller.address}</p>
          <p>${invoiceData.seller.phone}</p>
        </div>


        <div class="box">
          <h4>KHÁCH HÀNG</h4>

          <p><strong>${invoiceData.customer.name}</strong></p>
          <p>Tuổi: ${invoiceData.customer.age}</p>
          <p>${invoiceData.customer.address}</p>
        </div>

      </div>


      <!-- TABLE -->
      <table>

        <thead>
          <tr>
            <th>STT</th>
            <th>TÊN SẢN PHẨM</th>
            <th>SIZE</th>
            <th>SL</th>
            <th>ĐƠN GIÁ</th>
            <th>THÀNH TIỀN</th>
          </tr>
        </thead>

        <tbody>
          ${itemRows}
        </tbody>

      </table>


      <!-- SUMMARY -->
      <div class="summary">

        <div class="promotion-box">
          <h4>KHUYẾN MÃI / TRỢ GIÁ</h4>

          <p>
            ${invoiceData.promotion.description}
          </p>
        </div>


        <div class="total-box">

          <div class="total-item">
            <span>Cộng tiền hàng:</span>
            <strong>${formatCurrency(subTotal)}</strong>
          </div>

          <div class="total-item">
            <span>Khấu trừ giảm giá:</span>
            <strong>
              - ${formatCurrency(discount)}
            </strong>
          </div>

          <div class="total-item grand-total">
            <span>Tổng thanh toán:</span>
            <span>${formatCurrency(grandTotal)}</span>
          </div>

        </div>

      </div>
    `;


    // =========================
    // RENDER DOM
    // =========================

    const invoiceElement = document.getElementById("invoice");

    invoiceElement.innerHTML = html;

</script>

</body>
</html>
